<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:"
    />
    <title>Spotify of Legends Overlay</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div id="root">
      <div class="hud empty" id="hud">
        <div class="portrait">
          <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#F0E6D2" />
                <stop offset="0.5" stop-color="#C8AA6E" />
                <stop offset="1" stop-color="#785A28" />
              </linearGradient>
            </defs>
            <circle class="ring-outer" cx="50" cy="50" r="48.5" />
            <circle class="ring-track" cx="50" cy="50" r="44" />
            <circle class="ring-fill" id="ringFill" cx="50" cy="50" r="44" pathLength="100" />
          </svg>
          <div class="art">
            <img id="art" alt="" />
            <span class="art-empty" data-icon="note"></span>
          </div>
          <div class="badge" id="badge" data-icon="pause"></div>
        </div>

        <div class="plate">
          <div class="plate-inner">
            <div class="title" id="title">Spotify</div>
            <div class="artist" id="artist">Nothing playing</div>
            <div class="meta">
              <span id="time">0:00 / 0:00</span>
              <i class="sep"></i>
              <span class="device" id="device"></span>
            </div>
            <div class="controls">
              <button class="ctl" id="btnPrev" data-icon="prev" title="Previous"></button>
              <button class="ctl play" id="btnPlay" data-icon="play" title="Play / pause"></button>
              <button class="ctl" id="btnNext" data-icon="next" title="Next"></button>
              <span class="vol-icon" data-icon="volume"></span>
              <input type="range" class="lol-range" id="volume" min="0" max="100" />
              <button class="ctl lock" id="btnLock" data-icon="lock" title="Lock overlay (Ctrl + Alt + L)"></button>
            </div>
            <div class="vol-pip" id="volPip">
              <span data-icon="volume"></span>
              <div class="pip-bar"><i id="pipFill"></i></div>
              <b id="pipVal">50</b>
            </div>
          </div>
        </div>
      </div>
      <div class="hint">Unlocked: drag to move · <b>Ctrl + Alt + L</b> to lock</div>
    </div>

    <script src="icons.js"></script>
    <script src="common.js"></script>
    <script src="overlay.js"></script>
  </body>
</html>
